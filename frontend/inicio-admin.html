<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Consultorio Vida Sana - Administrador</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/tema.css">
    <script src="js/tema.js"></script>
</head>

<body class="panel-body">

    <div class="panel-topbar">
        <div class="panel-marca">
            <img src="img/logo-icono.png" alt="Vida Sana">
            Consultorio Vida Sana
        </div>
        <div class="panel-usuario">
            <button type="button" class="btn-tema" title="Cambiar tema"></button>
            <span id="nombreUsuario"></span>
            <button id="btnCerrarSesion">Cerrar sesión</button>
        </div>
    </div>

    <div class="panel-layout">
        <nav class="panel-sidebar">
            <button class="nav-item activo" data-seccion="usuarios">Registrar Usuario</button>
            <button class="nav-item" data-seccion="gestionar">Gestionar Usuarios</button>
            <button class="nav-item" data-seccion="registros">Ver Usuarios</button>
            <button class="nav-item" data-seccion="especialidades">Especialidades</button>
            <button class="nav-item" data-seccion="servicios">Servicios</button>
            <button class="nav-item" data-seccion="horarios">Horarios</button>
            <button class="nav-item" data-seccion="informes">Informes</button>
        </nav>

        <main class="panel-contenido">

            <section id="seccion-usuarios" class="seccion">
                <h2>Registrar doctor o secretaria</h2>
                <div class="tarjeta tarjeta-formulario">
                    <div class="campo-full">
                        <label>Rol</label>
                        <select id="selRol">
                            <option value="doctor">Doctor</option>
                            <option value="secretaria">Secretaria</option>
                        </select>
                    </div>

                    <div class="grid-2">
                        <div class="campo">
                            <label>Nombres</label>
                            <input type="text" id="uNombres">
                        </div>
                        <div class="campo">
                            <label>Apellidos</label>
                            <input type="text" id="uApellidos">
                        </div>

                        <div class="campo">
                            <label>Tipo de documento</label>
                            <select id="uTipoDocumento">
                                <option value="CC">CC</option>
                                <option value="TI">TI</option>
                                <option value="CE">CE</option>
                                <option value="PA">PA</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label>Número de documento</label>
                            <input type="text" id="uDocumento">
                        </div>

                        <div class="campo">
                            <label>Fecha de nacimiento</label>
                            <input type="date" id="uFechaNacimiento">
                        </div>
                        <div class="campo">
                            <label>Género</label>
                            <select id="uGenero">
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label>Estado civil</label>
                            <input type="text" id="uEstadoCivil" placeholder="Opcional">
                        </div>
                        <div class="campo">
                            <label>Teléfono</label>
                            <input type="text" id="uTelefono" placeholder="Opcional">
                        </div>

                        <div class="campo">
                            <label>Ciudad</label>
                            <input type="text" id="uCiudad" placeholder="Opcional">
                        </div>
                        <div class="campo">
                            <label>Correo</label>
                            <input type="email" id="uCorreo">
                        </div>

                        <div class="campo campo-full">
                            <label>Dirección</label>
                            <input type="text" id="uDireccion" placeholder="Opcional">
                        </div>
                    </div>

                    <div id="camposDoctor" class="grid-2" style="margin-top:6px;">
                        <div class="campo">
                            <label>Tarjeta profesional</label>
                            <input type="text" id="uTarjeta">
                        </div>
                        <div class="campo campo-full">
                            <label>Especialidades</label>
                            <div id="checksEspecialidades" class="grid-2"></div>
                        </div>
                    </div>

                    <div id="camposSecretaria" class="oculto" style="margin-top:6px;">
                        <label>Cargo</label>
                        <input type="text" id="uCargo" placeholder="Ej. Recepción">
                    </div>

                    <button id="btnRegistrarUsuario" style="margin-top:16px;">Registrar</button>
                    <p id="mensajeUsuario" class="error"></p>
                </div>
            </section>

            <section id="seccion-gestionar" class="seccion oculto">
                <h2>Gestionar usuarios</h2>
                <div id="listaUsuarios"></div>
            </section>

            <section id="seccion-registros" class="seccion oculto">
                <h2>Registros de usuarios</h2>
                <div id="contenedorRegistros"></div>
            </section>

            <section id="seccion-especialidades" class="seccion oculto">
                <h2>Especialidades</h2>
                <div class="tarjeta" style="max-width:420px;">
                    <label>Nombre</label>
                    <input type="text" id="espNombre" placeholder="Ej. Cardiología">
                    <label>Descripción</label>
                    <input type="text" id="espDescripcion" placeholder="Opcional">
                    <button id="btnCrearEspecialidad">Crear especialidad</button>
                    <p id="mensajeEspecialidad" class="error"></p>
                </div>
                <div id="listaEspecialidades"></div>
            </section>

            <section id="seccion-servicios" class="seccion oculto">
                <h2>Servicios y precios</h2>
                <div class="tarjeta" style="max-width:420px;">
                    <label>Nombre</label>
                    <input type="text" id="servNombre" placeholder="Ej. Consulta Medicina General">
                    <label>Descripción</label>
                    <input type="text" id="servDescripcion" placeholder="Opcional">
                    <label>Precio</label>
                    <input type="number" id="servPrecio" placeholder="Ej. 50000">
                    <button id="btnCrearServicio">Crear servicio</button>
                    <p id="mensajeServicio" class="error"></p>
                </div>
                <div id="listaServicios"></div>
            </section>

            <section id="seccion-horarios" class="seccion oculto">
                <h2>Horarios y bloqueos</h2>

                <div class="horarios-layout">
                    <div class="horarios-col-izq">
                        <label>Doctor</label>
                        <select id="selDoctorHorario"></select>

                        <div class="tarjeta">
                            <h3>Asignar horario regular</h3>
                            <label>Días de atención</label>
                            <div style="display:flex; gap:6px; margin-bottom:6px;">
                                <button type="button" id="btnLunesViernes"
                                    style="width:auto; margin-top:0; padding:5px 10px; font-size:0.75rem; background:#fff; color:#185fa5; border:1px solid #185fa5;">Lunes
                                    a domingo</button>
                                <button type="button" id="btnLimpiarDias"
                                    style="width:auto; margin-top:0; padding:5px 10px; font-size:0.75rem; background:#fff; color:#5f5e5a; border:1px solid #d3d1c7;">Limpiar</button>
                            </div>
                            <div id="checksDias">
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Lunes"> Lunes</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Martes"> Martes</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Miercoles"> Miércoles</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Jueves"> Jueves</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Viernes"> Viernes</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Sabado"> Sábado</label>
                                <label
                                    style="display:flex; align-items:center; gap:8px; font-weight:normal; margin:4px 0;"><input
                                        type="checkbox" class="chk-dia" value="Domingo"> Domingo</label>
                            </div>
                            <label>Hora inicio</label>
                            <input type="time" id="horInicio">
                            <label>Hora fin</label>
                            <input type="time" id="horFin">
                            <button id="btnAsignarHorario">Asignar horario</button>
                            <p id="mensajeHorario" class="error"></p>
                        </div>

                        <div class="tarjeta">
                            <h3>Crear bloqueo puntual</h3>
                            <label>Fecha</label>
                            <input type="date" id="bloqFecha">
                            <label>Hora inicio</label>
                            <input type="time" id="bloqInicio">
                            <label>Hora fin</label>
                            <input type="time" id="bloqFin">
                            <label>Motivo</label>
                            <input type="text" id="bloqMotivo" placeholder="Ej. Incapacidad médica">
                            <button id="btnCrearBloqueo">Crear bloqueo</button>
                            <p id="mensajeBloqueo" class="error"></p>
                        </div>
                    </div>

                    <div class="horarios-col-der">
                        <div id="listaHorarios"></div>
                    </div>
                </div>
            </section>

            <section id="seccion-informes" class="seccion oculto">
                <h2>Informes y análisis</h2>

                <div class="tarjeta" style="max-width:420px;">
                    <label>Desde</label>
                    <input type="date" id="infDesde">
                    <label>Hasta</label>
                    <input type="date" id="infHasta">
                    <button id="btnGenerarInforme">Generar informe</button>
                    <p id="mensajeInforme" class="error"></p>
                </div>

                <div id="resultadoInformes"></div>
            </section>

        </main>
    </div>


    <script src="js/registros.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
