<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Consultorio Vida Sana - Inicio</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/panel.css">
</head>

<body class="panel-body">

  <div class="panel-topbar">
    <div class="panel-marca">
      <img src="img/logo-icono.png" alt="Vida Sana">
      Consultorio Vida Sana
    </div>
    <div class="panel-usuario">
      <div id="zonaCampana"></div>
      <span id="nombreUsuario"></span>
      <button id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </div>

  <div class="panel-layout">
    <nav class="panel-sidebar">
      <button class="nav-item activo" data-seccion="inicio">Inicio</button>
      <button class="nav-item" data-seccion="citas">Citas</button>
      <button class="nav-item" data-seccion="historia">Historia Clínica</button>
      <button class="nav-item" data-seccion="documentos">Fórmulas y Órdenes</button>
    </nav>

    <main class="panel-contenido">

      <section id="seccion-inicio" class="seccion">
        <h2>Bienvenido(a)</h2>
        <img src="img/bienvenida.jpg" alt="Vida Sana" class="inicio-banner">
        <div id="proximaCita" class="tarjeta-aviso">Cargando tu próxima cita...</div>
      </section>

      <section id="seccion-citas" class="seccion oculto">
        <h2>Mis citas</h2>

        <h3>Agendar nueva cita</h3>
        <div id="agendadorPaciente"></div>

        <h3>Historial de citas</h3>
        <div id="listaCitas"></div>
      </section>

      <section id="seccion-citas" class="seccion oculto">
        <h2>Mis citas</h2>

        <div class="citas-layout">
          <div class="citas-col-izq">
            <h3>Historial de citas</h3>
            <div id="listaCitas"></div>
          </div>
          <div class="citas-col-der">
            <h3>Agendar nueva cita</h3>
            <div id="agendadorPaciente"></div>
          </div>
        </div>
      </section>

      <h3>Agendar nueva cita</h3>
      <div id="agendadorPaciente"></div>

      <h3>Historial de citas</h3>
      <div id="listaCitas"></div>
      </section>

      <section id="seccion-documentos" class="seccion oculto">
        <h2>Mis documentos</h2>
        <div id="contenidoDocumentos"></div>
      </section>

    </main>
  </div>

  <script src="js/notificaciones.js"></script>
  <script src="js/agendador.js"></script>
  <script src="js/paciente.js"></script>
</body>

</html>
