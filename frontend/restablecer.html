<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Consultorio Vida Sana - Restablecer contraseña</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/tema.css">
  <script src="js/tema.js"></script>
</head>

<body class="pagina-login">
  <button type="button" class="btn-tema btn-tema-flotante" title="Cambiar tema"></button>
  <div class="contenedor-login">
    <div class="icono-consultorio">🩺</div>
    <p style="font-weight:700; color:#185fa5; font-size:1.15rem; margin:0 0 2px;">Nueva contraseña</p>
    <p class="subtitulo">Ingresa tu nueva contraseña</p>

    <form id="formRestablecer">
      <label for="contrasenaNueva">Contraseña nueva</label>
      <div class="campo-contrasena">
        <input type="password" id="contrasenaNueva" placeholder="Mínimo 6 caracteres" required>
        <button type="button" id="btnVerContrasena" class="boton-ojo">👁️</button>
      </div>

      <label for="contrasenaConfirmar">Confirmar contraseña</label>
      <input type="password" id="contrasenaConfirmar" placeholder="Repite la contraseña" required>

      <button type="submit" class="btn-primario">Restablecer contraseña</button>
    </form>

    <div id="resultado" style="margin-top:16px; font-size:0.85rem;"></div>
  </div>

  <script src="js/restablecer.js"></script>
</body>

</html>
